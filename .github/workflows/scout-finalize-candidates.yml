name: Scout forensic reconstruction (no speculative GLB)

on:
  push:
    branches: [main]
    paths:
      - "tools/scout-finalize.mjs"
      - "tools/reconstruct-scout.mjs"
      - "tools/export-dpc-armour-geometry.mjs"
      - ".github/workflows/scout-finalize-candidates.yml"
      - "original-data/units.ff"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  forensic-reconstruction:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Syntax-check Scout tools
        run: |
          node --check tools/scout-finalize.mjs
          node --check tools/reconstruct-scout.mjs
          node --check tools/export-dpc-armour-geometry.mjs

      - name: Run integrated Scout forensic reconstruction
        run: |
          node tools/scout-finalize.mjs original-data/units.ff scout-final

      - name: Upload forensic evidence bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scout-forensic-evidence
          path: |
            scout-final.zip
            scout-final/reconstruction-manifest.json
            scout-final/autodiscovery/**/*.json
            scout-final/transform-hierarchy/**/*.json
            scout-final/attachments/**/*.json
            scout-final/callbacks/**/*.json
            scout-final/part-graph/**/*.json
          if-no-files-found: warn
          retention-days: 30

      - name: Publish forensic manifest to a dedicated branch
        if: always() && hashFiles('scout-final/reconstruction-manifest.json') != ''
        shell: bash
        run: |
          set -e
          branch="scout-forensic-results-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --orphan "$branch"
          mkdir -p diagnostics/scout
          cp scout-final/reconstruction-manifest.json diagnostics/scout/reconstruction-manifest.json
          git add diagnostics/scout/reconstruction-manifest.json
          git commit -m "Publish Scout forensic reconstruction manifest"
          git push origin "HEAD:refs/heads/$branch"
