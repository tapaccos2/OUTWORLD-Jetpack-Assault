name: Game browser smoke test

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

jobs:
  browser-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Parse-check game source before browser test
        run: |
          node --check src/main.js
          node --check src/terrain-preview.js
          node --check tools/inspect-dpc-graph.mjs
          node --check tools/inspect-dpc-graph-compare.mjs
          node --check tools/inspect-dpc-point-lists.mjs
          node --check tools/inspect-dpc-type8.mjs
      - name: Install Playwright
        run: |
          npm init -y
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Test published game in Chromium
        run: |
          cat > smoke-test.cjs <<'EOF'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 1440, height: 900 } });
            const errors = [];
            page.on('pageerror', e => errors.push(e.message));
            page.on('console', m => { if (m.type() === 'error') errors.push(m.text()); });
            page.on('requestfailed', r => errors.push('REQUEST FAILED: ' + r.url() + ' — ' + r.failure()?.errorText));
            const url = 'https://tapaccos2.github.io/OUTWORLD-Jetpack-Assault/?smoke=' + Date.now();
            let response;
            for (let attempt = 0; attempt < 12; attempt++) {
              try {
                response = await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 20000 });
                if (response && response.ok()) break;
              } catch (e) { if (attempt === 11) throw e; }
              await page.waitForTimeout(5000);
            }
            if (!response || !response.ok()) throw new Error('GitHub Pages returned HTTP ' + (response?.status() ?? 'no response'));
            await page.waitForTimeout(8000);
            await page.screenshot({ path: 'game-smoke-test.png', fullPage: true });
            const result = await page.evaluate(() => ({
              title: document.title,
              canvas: !!document.querySelector('#game'),
              canvasSize: (() => { const c = document.querySelector('#game'); return c ? [c.width, c.height] : null; })(),
              startupError: document.querySelector('#message')?.innerText || '',
              webgl: (() => { const c = document.createElement('canvas'); return !!(c.getContext('webgl2') || c.getContext('webgl')); })(),
              build: document.querySelector('.brand small')?.innerText || ''
            }));
            console.log('GAME CHECK:', JSON.stringify(result));
            if (!result.canvas) throw new Error('Game canvas is missing');
            if (!result.canvasSize || result.canvasSize[0] < 1000 || result.canvasSize[1] < 600) throw new Error('Renderer did not resize canvas; game likely failed to initialise: ' + JSON.stringify(result.canvasSize));
            if (result.startupError.includes('STARTUP ERROR') || result.startupError.includes('3D ENGINE NOT LOADED')) throw new Error('Game startup error: ' + result.startupError);
            if (errors.length) console.log('GAME BROWSER ERRORS:', JSON.stringify(errors));
            if (errors.some(e => /Uncaught|ReferenceError|SyntaxError|TypeError|Failed to fetch dynamically imported module|Failed to resolve module specifier|WebGL.*context/i.test(e))) throw new Error('Critical game browser errors detected');

            // Smoke-test the terrain page from this checked-out commit. Using Pages
            // here can race a separate deployment workflow and accidentally test the
            // previous build instead of the source under test.
            errors.length = 0;
            const fs = require('fs');
            const path = require('path');
            const http = require('http');
            const repoRoot = process.cwd();
            const mimeTypes = {
              '.html': 'text/html; charset=utf-8',
              '.js': 'text/javascript; charset=utf-8',
              '.mjs': 'text/javascript; charset=utf-8',
              '.css': 'text/css; charset=utf-8',
              '.json': 'application/json; charset=utf-8',
              '.gpc': 'application/octet-stream',
              '.rpc': 'application/octet-stream',
              '.pcx': 'application/octet-stream',
              '.png': 'image/png',
              '.obj': 'text/plain; charset=utf-8'
            };
            const localServer = http.createServer((request, response) => {
              let requestPath;
              try { requestPath = decodeURIComponent(new URL(request.url, 'http://127.0.0.1').pathname); }
              catch { response.writeHead(400); response.end('Bad request'); return; }
              const filePath = path.resolve(repoRoot, '.' + requestPath);
              if (filePath !== repoRoot && !filePath.startsWith(repoRoot + path.sep)) {
                response.writeHead(403); response.end('Forbidden'); return;
              }
              fs.readFile(filePath, (error, bytes) => {
                if (error) { response.writeHead(error.code === 'ENOENT' ? 404 : 500); response.end('Not found'); return; }
                response.writeHead(200, {
                  'Content-Type': mimeTypes[path.extname(filePath).toLowerCase()] || 'application/octet-stream',
                  'Cache-Control': 'no-store'
                });
                response.end(bytes);
              });
            });
            await new Promise((resolve, reject) => {
              localServer.once('error', reject);
              localServer.listen(4173, '127.0.0.1', resolve);
            });
            const terrainUrl = 'http://127.0.0.1:4173/terrain-preview.html?smoke=' + Date.now();
            let terrainResponse;
            for (let attempt = 0; attempt < 12; attempt++) {
              try {
                terrainResponse = await page.goto(terrainUrl, { waitUntil: 'domcontentloaded', timeout: 20000 });
                if (terrainResponse && terrainResponse.ok()) break;
              } catch (e) { if (attempt === 11) throw e; }
              await page.waitForTimeout(5000);
            }
            if (!terrainResponse || !terrainResponse.ok()) throw new Error('Terrain preview returned HTTP ' + (terrainResponse?.status() ?? 'no response'));
            try {
              await page.waitForFunction(() => {
                const status = document.querySelector('#status')?.innerText || '';
                const canvas = document.querySelector('#referenceCanvas');
                return status.includes('MAP RAG01') && canvas && canvas.width === 1660 && canvas.height === 1556;
              }, null, { timeout: 30000 });
            } catch (error) {
              const diagnostic = await page.evaluate(() => ({
                title: document.title,
                map: document.querySelector('#map')?.value,
                status: document.querySelector('#status')?.innerText,
                referenceTitle: document.querySelector('#referenceTitle')?.innerText,
                referenceNote: document.querySelector('#referenceNote')?.innerText,
                referenceSize: [document.querySelector('#referenceCanvas')?.width, document.querySelector('#referenceCanvas')?.height],
                scripts: [...document.scripts].map(script => script.src).filter(Boolean)
              }));
              console.log('TERRAIN PREVIEW DIAGNOSTIC:', JSON.stringify(diagnostic));
              console.log('TERRAIN PREVIEW BROWSER ERRORS BEFORE ASSERTION:', JSON.stringify(errors));
              await page.screenshot({ path: 'terrain-preview-debug.png', fullPage: true });
              throw error;
            }
            await page.click('#referenceToggle');
            const referenceCheck = await page.evaluate(() => {
              const panel = document.querySelector('#referencePanel');
              const reference = document.querySelector('#referenceCanvas');
              const overlay = document.querySelector('#overlayCanvas');
              let overlayAlphaPixels = 0;
              if (overlay && overlay.width > 1 && overlay.height > 1) {
                const pixels = overlay.getContext('2d').getImageData(0, 0, overlay.width, overlay.height).data;
                for (let i = 3; i < pixels.length; i += 4) if (pixels[i] > 0) overlayAlphaPixels++;
              }
              return {
                visible: !!panel && !panel.hidden,
                referenceSize: [reference?.width, reference?.height],
                overlaySize: [overlay?.width, overlay?.height],
                overlaySurfaceCount: Number(overlay?.dataset.surfaceCount || 0),
                overlayAlphaPixels,
                overlayRotation: overlay?.dataset.rotation
              };
            });
            console.log('TERRAIN OVERLAY ASSERTION:', JSON.stringify(referenceCheck));
            if (!referenceCheck.visible ||
                referenceCheck.referenceSize[0] !== 1660 || referenceCheck.referenceSize[1] !== 1556 ||
                referenceCheck.overlaySize[0] !== 1660 || referenceCheck.overlaySize[1] !== 1556 ||
                referenceCheck.overlaySurfaceCount !== 767 || referenceCheck.overlayAlphaPixels === 0) {
              throw new Error('Original map or candidate RPC surface overlay did not render correctly');
            }
            await page.locator('#overlayRotation').evaluate(el => { el.value = '30'; el.dispatchEvent(new Event('input', { bubbles: true })); });
            const rotated = await page.evaluate(() => document.querySelector('#overlayCanvas')?.dataset.rotation);
            if (rotated !== '30') throw new Error('RPC overlay rotation control failed');
            await page.click('#overlayReset');
            const resetRotation = await page.evaluate(() => document.querySelector('#overlayCanvas')?.dataset.rotation);
            if (resetRotation !== '0') throw new Error('RPC overlay alignment reset failed');
            await page.click('#topDown');
            await page.screenshot({ path: 'terrain-preview-smoke-test.png', fullPage: true });
            console.log('TERRAIN PREVIEW CHECK:', JSON.stringify(await page.evaluate(() => ({
              title: document.title,
              map: document.querySelector('#map')?.value,
              status: document.querySelector('#status')?.innerText,
              referenceTitle: document.querySelector('#referenceTitle')?.innerText,
              referenceSize: [document.querySelector('#referenceCanvas')?.width, document.querySelector('#referenceCanvas')?.height],
              overlaySize: [document.querySelector('#overlayCanvas')?.width, document.querySelector('#overlayCanvas')?.height],
              overlaySurfaceCount: document.querySelector('#overlayCanvas')?.dataset.surfaceCount,
              overlayRotation: document.querySelector('#overlayCanvas')?.dataset.rotation,
              referenceVisible: !document.querySelector('#referencePanel')?.hidden,
              topDownButton: !!document.querySelector('#topDown')
            }))));
            if (errors.length) console.log('TERRAIN BROWSER ERRORS:', JSON.stringify(errors));
            if (errors.some(e => /Uncaught|ReferenceError|SyntaxError|TypeError|Failed to fetch dynamically imported module|Failed to resolve module specifier|WebGL.*context/i.test(e))) throw new Error('Critical terrain browser errors detected');
            await new Promise(resolve => localServer.close(resolve));
            await browser.close();
          // Execute the DPC pointer graph diagnostics from the checkout as a
          // local parser smoke test. Numeric class IDs stay semantic-neutral.
          const { spawnSync } = require('child_process');
          const graph = spawnSync('node', [
            'tools/inspect-dpc-graph.mjs',
            'original-data/structs/rag01.dpc',
            '--max-depth=4',
            '--max-nodes=2000'
          ], { encoding: 'utf8', maxBuffer: 64 * 1024 * 1024 });
          if (graph.status !== 0) throw new Error('DPC graph inspector failed: ' + (graph.stderr || graph.stdout).slice(0, 4000));
          const graphResult = JSON.parse(graph.stdout);
          console.log('DPC GRAPH CHECK:', JSON.stringify({
            file: graphResult.file,
            topLevelCount: graphResult.topLevelCount,
            walkedNodeCount: graphResult.walkedNodeCount,
            edgeCount: graphResult.edgeCount,
            errorCount: graphResult.errors.length,
            truncated: graphResult.truncated,
            byTypeClass: graphResult.byTypeClass
          }));
          if (graphResult.errors.length || graphResult.truncated) throw new Error('DPC graph inspector reported invalid pointers or hit a traversal limit');

          const comparison = spawnSync('node', [
            'tools/inspect-dpc-graph-compare.mjs',
            'original-data/structs/rag01.dpc',
            'original-data/structs/rag02.dpc',
            'original-data/structs/rag04.dpc',
            'original-data/structs/anub01.dpc',
            'original-data/structs/dead01.dpc',
            'original-data/structs/oasis01.dpc'
          ], { encoding: 'utf8', maxBuffer: 64 * 1024 * 1024 });
          if (comparison.status !== 0) throw new Error('DPC graph comparison failed: ' + (comparison.stderr || comparison.stdout).slice(0, 4000));
          const comparisonResult = JSON.parse(comparison.stdout);
          console.log('DPC CAMPAIGN COMPARISON:', JSON.stringify(comparisonResult.files.map(item => ({
            file: item.file,
            topLevelCount: item.topLevelCount,
            walkedNodeCount: item.walkedNodeCount,
            edgeCount: item.edgeCount,
            errorCount: item.errorCount,
            truncated: item.truncated,
            typeClasses: item.byTypeClass
          }))));
          if (comparisonResult.files.some(item => item.error || item.errorCount || item.truncated)) {
            throw new Error('DPC campaign comparison found a parser failure or traversal limit');
          }

          const pointLists = ['rag04', 'dead01'].map(name => {
            const result = spawnSync('node', [
              'tools/inspect-dpc-point-lists.mjs',
              'original-data/structs/' + name + '.dpc'
            ], { encoding: 'utf8', maxBuffer: 16 * 1024 * 1024 });
            if (result.status !== 0) throw new Error('DPC point-list inspector failed for ' + name + ': ' + (result.stderr || result.stdout).slice(0, 4000));
            return JSON.parse(result.stdout);
          });
          const triples = pointLists.map(item => item.lists.flatMap(list => list.children.slice(0, 6).map(child => child.candidateTriple)));
          console.log('DPC CANDIDATE TRIPLES:', JSON.stringify(pointLists.map((item, index) => ({
            file: item.file, listCount: item.observedListCount, firstListTriples: triples[index][0] ? triples[index] : []
          }))));
          if (!pointLists.every(item => item.observedListCount > 0) ||
              JSON.stringify(triples[0][0]) !== JSON.stringify(triples[1][0])) {
            throw new Error('Candidate coordinate triples did not match across rag04 and dead01');
          }

          const type8Checks = [
            ['rag02', 57],
            ['rag04', 175],
            ['oasis03', 104]
          ].map(([name, expected]) => {
            const result = spawnSync('node', [
              'tools/inspect-dpc-type8.mjs',
              name === 'oasis03' ? 'oasis03.dpc' : 'original-data/structs/' + name + '.dpc'
            ], { encoding: 'utf8', maxBuffer: 32 * 1024 * 1024 });
            if (result.status !== 0) throw new Error('DPC type-8 inspector failed for ' + name + ': ' + (result.stderr || result.stdout).slice(0, 4000));
            const parsed = JSON.parse(result.stdout);
            console.log('DPC TYPE-8 CHECK:', JSON.stringify({
              file: parsed.file,
              reachableType8Count: parsed.reachableType8Count,
              parentTypes: parsed.parentTypes,
              parentFields: parsed.parentFields,
              slotSummary: parsed.slotSummary
            }));
            if (parsed.reachableType8Count !== expected) {
              throw new Error('Unexpected type-8 count for ' + name + ': expected ' + expected + ', got ' + parsed.reachableType8Count);
            }
            if (!parsed.traversalComplete || parsed.pendingQueueItems !== 0) {
              throw new Error('DPC type-8 traversal was incomplete for ' + name + ': ' + parsed.pendingQueueItems + ' queued records remain');
            }
            if (parsed.type8RecordsTruncated !== 0) {
              throw new Error('DPC type-8 records were truncated for ' + name + ': ' + parsed.type8RecordsTruncated);
            }
            return parsed;
          });
          if (!type8Checks.every(item => item.slotSummary[0].near4096 === item.reachableType8Count &&
              item.slotSummary[1].near4096 === item.reachableType8Count &&
              item.slotSummary[2].near4096 === item.reachableType8Count &&
              item.slotSummary[4].near4096 === item.reachableType8Count &&
              item.slotSummary[5].near4096 >= item.reachableType8Count - 2)) {
            throw new Error('DPC type-8 vector-length pattern changed unexpectedly');
          }
          })().catch(e => { console.error(e); process.exit(1); });
          EOF
          node smoke-test.cjs
      - name: Upload browser screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: outworld-browser-smoke-test
          path: |
            game-smoke-test.png
            terrain-preview-smoke-test.png
            terrain-preview-debug.png
          if-no-files-found: ignore
