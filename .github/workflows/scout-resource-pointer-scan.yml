name: Scout runtime and resource-pointer reconstruction

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/scout-resource-pointer-scan.yml"
      - "tools/scout-resource-pointer-scan.mjs"
      - "tools/scout-runtime-callback-rebuild.mjs"
      - "tools/audit-scout-transform-attachments.mjs"
      - "tools/scout-transform-attached-descriptor-audit.mjs"
      - "tools/inspect-scout-transform-mesh-payloads.mjs"
      - "tools/inspect-scout-transform-records.mjs"
      - "tools/extract-ff-resources.mjs"
      - "original-data/units.ff"
      - "original-data/structs/**"

permissions:
  contents: read

jobs:
  rebuild-and-resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Extract unit resources
        run: |
          test -f original-data/units.ff
          node tools/extract-ff-resources.mjs original-data/units.ff --out .scout-resource-scan-extracted
          test -f .scout-resource-scan-extracted/units/scout_mj.dpc
          find .scout-resource-scan-extracted/units -type f | sort > scout-resource-file-list.txt

      - name: Rebuild runtime callback and transform candidates
        run: |
          node tools/scout-runtime-callback-rebuild.mjs \
            .scout-resource-scan-extracted/units/scout_mj.dpc \
            scout-runtime-rebuild

      - name: Compare all Scout model variants
        run: |
          mkdir -p scout-variant-comparison
          for dpc in .scout-resource-scan-extracted/units/scout_*.dpc; do
            variant=$(basename "$dpc" .dpc)
            echo "Rebuilding $variant"
            node tools/scout-runtime-callback-rebuild.mjs "$dpc" "scout-variant-comparison/$variant"
          done
          node - <<'NODE'
          const fs=require('fs'),path=require('path');
          const root='scout-variant-comparison';
          const rows=[];
          for(const variant of fs.readdirSync(root)){
            const file=path.join(root,variant,'runtime-rebuild.json');
            if(!fs.existsSync(file))continue;
            const d=JSON.parse(fs.readFileSync(file,'utf8'));
            rows.push({variant,descriptorExecutions:d.descriptorExecutions?.length??0,uniqueDescriptors:new Set((d.descriptorExecutions||[]).map(x=>x.descriptor)).size,helperRecords:d.helperSlotAssignments?.length??0,matrixFrames:d.matrixFrames?.length??0});
          }
          fs.writeFileSync(path.join(root,'variant-comparison.json'),JSON.stringify(rows,null,2));
          fs.writeFileSync(path.join(root,'variant-comparison.md'),'# Scout variant comparison\n\n'+rows.map(x=>'- **'+x.variant+'**: '+x.descriptorExecutions+' executions, '+x.uniqueDescriptors+' unique descriptors, '+x.helperRecords+' primitive records, '+x.matrixFrames+' transform frames').join('\n')+'\n');
          NODE

      - name: Audit transform-attached descriptors
        run: |
          mkdir -p scout-bridge/analysis
          node tools/audit-scout-transform-attachments.mjs \
            .scout-resource-scan-extracted/units/scout_mj.dpc \
            scout-bridge/analysis/transform-attachment-audit.json
          node tools/scout-transform-attached-descriptor-audit.mjs \
            .scout-resource-scan-extracted/units/scout_mj.dpc \
            scout-bridge/analysis/transform-attachment-audit.json \
            scout-transform-attached-descriptor-audit

      - name: Inventory transform payloads and transform roots
        run: |
          mkdir -p scout-transform-payload-inventory
          node tools/inspect-scout-transform-mesh-payloads.mjs .scout-resource-scan-extracted/units/scout_mj.dpc scout-transform-payload-inventory/transform-mesh-payloads.json
          node tools/inspect-scout-transform-records.mjs .scout-resource-scan-extracted/units/scout_mj.dpc > scout-transform-payload-inventory/transform-records.json

      - name: Decode Scout texture variants
        run: |
          node tools/decode-tpc-palette-textures.mjs .scout-resource-scan-extracted/units/scout_mj.tpc scout-textures/scout_mj
          node tools/decode-tpc-palette-textures.mjs .scout-resource-scan-extracted/units/scout_ma.tpc scout-textures/scout_ma
          node tools/decode-tpc-palette-textures.mjs .scout-resource-scan-extracted/units/scout_md.tpc scout-textures/scout_md
          cp original-data/SCOUT-TPC-DECODING.md scout-textures/

      - name: Resolve cross-resource pointers
        run: |
          node tools/scout-resource-pointer-scan.mjs \
            .scout-resource-scan-extracted/units/scout_mj.dpc \
            scout-resource-pointer-scan \
            .scout-resource-scan-extracted/units \
            original-data

      - name: Bundle analysis outputs
        if: always()
        run: |
          mkdir -p scout-analysis-bundle
          [ ! -d scout-runtime-rebuild ] || cp -a scout-runtime-rebuild scout-analysis-bundle/
          [ ! -d scout-variant-comparison ] || cp -a scout-variant-comparison scout-analysis-bundle/
          [ ! -d scout-resource-pointer-scan ] || cp -a scout-resource-pointer-scan scout-analysis-bundle/
          [ ! -d scout-textures ] || cp -a scout-textures scout-analysis-bundle/
          [ ! -d scout-transform-payload-inventory ] || cp -a scout-transform-payload-inventory scout-analysis-bundle/
          [ ! -d scout-transform-attached-descriptor-audit ] || cp -a scout-transform-attached-descriptor-audit scout-analysis-bundle/
          [ ! -f scout-transform-attached-descriptor-audit.zip ] || cp scout-transform-attached-descriptor-audit.zip scout-analysis-bundle/
          [ ! -f scout-bridge/analysis/transform-attachment-audit.json ] || cp scout-bridge/analysis/transform-attachment-audit.json scout-analysis-bundle/
          [ ! -f scout-resource-file-list.txt ] || cp scout-resource-file-list.txt scout-analysis-bundle/
          cp original-data/units.ff scout-analysis-bundle/units.ff
          cp -a .scout-resource-scan-extracted/units scout-analysis-bundle/extracted-units
          zip -qr scout-runtime-resource-analysis.zip scout-analysis-bundle

      - name: Upload reconstruction results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scout-runtime-resource-analysis
          path: |
            scout-runtime-resource-analysis.zip
            scout-runtime-rebuild/**
            scout-variant-comparison/**
            scout-resource-pointer-scan/**
            scout-textures/**
            scout-transform-payload-inventory/**
            scout-transform-attached-descriptor-audit/**
            scout-transform-attached-descriptor-audit.zip
            scout-bridge/analysis/transform-attachment-audit.json
            scout-resource-file-list.txt
          if-no-files-found: warn
          retention-days: 14
